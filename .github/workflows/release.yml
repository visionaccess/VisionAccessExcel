name: Build and release add-on

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        run: |
          version=$(grep -E '^version *=' addon/manifest.ini | sed -E 's/^version *= *//' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .nvda-addon package
        run: |
          cd addon
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -r -X "../visionAccessExcel-${{ steps.meta.outputs.version }}.nvda-addon" manifest.ini appModules globalPlugins doc

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: visionAccessExcel-${{ steps.meta.outputs.version }}
          path: "*.nvda-addon"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.nvda-addon"
          body_path: CHANGELOG.md
